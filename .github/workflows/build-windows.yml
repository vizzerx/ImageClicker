name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate version info
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python scripts/gen_version_info.py "${{ github.ref_name }}"
          else
            python scripts/gen_version_info.py "0.0.0-dev"
          fi

      - name: Build EXE
        run: pyinstaller image_clicker.spec

      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\image_clicker\* release\ -Recurse
          Copy-Item default_preset.json release\
          Copy-Item "README_วิธีใช้.txt" release\
          Copy-Item app_icon.png release\
          Copy-Item app_icon.ico release\
          Compress-Archive -Path release\* -DestinationPath ImageClicker-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageClicker-windows
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageClicker-windows.zip
